# HotPotQA-specific Prompt Templates
# These prompts are optimized for multi-hop question answering tasks

prompts:
  # System prompt that defines the agent's role and capabilities
  # Variables: {tools_description}, {task_description}
  system_prompt: |
    You are an expert research assistant capable of answering complex questions by systematically searching and analyzing information from Wikipedia.
    
    Your mission: Answer multi-hop questions that require connecting information across multiple sources.
    
    Available tools:
    {tools_description}
    
    Task context:
    {task_description}
    
    Always think step by step, gather all necessary information before concluding, and provide precise, factual answers.

  # Main chain-of-thought prompt for HotPotQA
  # Variables: {examples}, {tools}, {input}, {trajectory}
  cot_prompt: |
    Solve a question answering task with interleaving Thought, Action, Observation steps. 
    Thought can reason about the current situation, and Action can be three types: 
    (1) Search[entity], which searches the exact entity on Wikipedia and returns the first paragraph if it exists. If not, it will return some similar entities to search.
    (2) Lookup[keyword], which returns the next sentence containing keyword in the current passage.
    (3) Finish[answer], which returns the answer and finishes the task.
    After each observation, provide the next Thought and next Action. Here are some examples:

    Question: What is the elevation range for the area that the eastern sector of the Colorado orogeny extends into?
    Thought 1: I need to search Colorado orogeny, find the area that the eastern sector of the Colorado orogeny extends into, then find the elevation range of the area.
    Action 1: Search[Colorado orogeny]
    Observation 1: The Colorado orogeny was an episode of mountain building (an orogeny) in Colorado and surrounding areas. This took place from 1780 to 1650 million years ago (Mya), during the Paleoproterozoic (Statherian Period). It is recorded in the Colorado orogen, a >500-km-wide belt of oceanic arc rock that extends southward into New Mexico. The Colorado orogeny was likely part of the larger Yavapai orogeny.
    Thought 2: It does not mention the eastern sector of the Colorado orogeny. I need to look up eastern sector.
    Action 2: Lookup[eastern sector]
    Observation 2: (Result 1 / 1) The eastern sector extends into the High Plains and is called the Central Plains orogeny.
    Thought 3: The eastern sector of Colorado orogeny extends into the High Plains, so High Plains is the area. I need to search High Plains and find its elevation range.
    Action 3: Search[High Plains]
    Observation 3: The High Plains are a subregion of the Great Plains. From east to west, the High Plains rise in elevation from around 1,800 to 7,000 ft (550 to 2,130 m).
    Thought 4: High Plains rise in elevation from around 1,800 to 7,000 ft, so the answer is 1,800 to 7,000 ft.
    Action 4: Finish[1,800 to 7,000 ft]

    Question: Musician and satirist Allie Goertz wrote a song about the "The Simpsons" character Milhouse, who Matt Groening named after who?
    Thought 1: The question simplifies to "The Simpsons" character Milhouse is named after who. I only need to search Milhouse and find who it is named after.
    Action 1: Search[Milhouse]
    Observation 1: Milhouse Mussolini Van Houten is a recurring character in the Fox animated television series The Simpsons voiced by Pamela Hayden and created by Matt Groening.
    Thought 2: The paragraph does not tell who Milhouse is named after, maybe I can look up "named after".
    Action 2: Lookup[named after]
    Observation 2: (Result 1 / 1) Milhouse was named after U.S. president Richard Nixon, whose middle name was Milhous. 
    Thought 3: Milhouse was named after U.S. president Richard Nixon, so the answer is Richard Nixon.
    Action 3: Finish[Richard Nixon]

    Question: Guitars for Wounded Warriors is an album that was recorded in the village in which New York county?
    Thought 1: I need to search Guitars for Wounded Warriors, then find in which New York county it was recorded.
    Action 1: Search[Guitars for Wounded Warriors]
    Observation 1: Guitars for Wounded Warriors is the sixth solo studio album by guitarist Brian Tarquin, released in August 2014 by Cleopatra Records. All tracks were recorded at Tarquin's Jungle Room Studios in New Paltz (village), New York.
    Thought 2: Guitars for Wounded Warriors was recorded in New Paltz (village), New York. I need to search New Paltz (village), New York and find which county it is in.
    Action 2: Search[New Paltz (village), New York]
    Observation 2: New Paltz is a village in Ulster County located in the U.S. state of New York. It is approximately 80 miles (130 km) north of New York City and 70 miles (110 km) south of Albany. The population was 7,324 at the 2020 census.
    Thought 3: New Paltz (village), New York is in Ulster County, so the answer is Ulster County.
    Action 3: Finish[Ulster County]

    Question: {input}
    Current progress:
    {trajectory}

  # Shortened COT prompt for faster processing
  # Variables: {tools}, {input}, {trajectory}
  cot_prompt_short: |
    Answer the question using Wikipedia search and lookup. Think step by step.
    
    Available tools:
    - Search[entity]: Search Wikipedia for an entity
    - Lookup[keyword]: Find keyword in current page
    - Finish[answer]: Submit your final answer
    
    Question: {input}
    Progress:
    {trajectory}
    
    What's your next thought and action?

  # Reflection prompt for learning from failures
  # Variables: {trajectory}, {question}, {answer}, {correct_answer}
  reflection_prompt: |
    You are an advanced reasoning agent that can improve based on self reflection. You will be given a previous reasoning trial in which you were given access to a Docstore API environment and a question to answer. You were unsuccessful in answering the question either because you guessed the wrong answer with Finish[<answer>], or you used up your set number of reasoning steps. In a few sentences, Diagnose a possible reason for failure and devise a new, concise, high level plan that aims to mitigate the same failure. Use complete sentences.

    Here are some examples:
    Previous Trial:
    Question: The Rome Protocols were signed by three Prime Ministers one of which was assassinated as part of what?
    Thought 1: I need to search Rome Protocols, find the three Prime Ministers, then find what they were assassinated as part of.
    Action 1: Search[Rome Protocols]
    Observation 1: The Rome Protocols were a series of three international agreements concluded in Rome on 17 March 1934 between the governments of Austria, Hungary and Italy. They were signed by Italian Prime Minister Benito Mussolini, Austrian Chancellor Engelbert Dollfuss and Hungarian Prime Minister Gyula Gömbös.
    Thought 2: The three Prime Ministers were Benito Mussolini, Engelbert Dollfuss, and Gyula Gömbös. I need to search Benito Mussolini and find what he was assassinated as part of.
    Action 2: Search[Benito Mussolini]
    Observation 2: Benito Amilcare Andrea Mussolini was an Italian politician and journalist who founded and led the National Fascist Party (PNF). He was Prime Minister of Italy from the March on Rome in 1922 until his deposition in 1943, as well as "Duce" of Italian fascism from the establishment of the Italian Fasces of Combat in 1919 until his summary execution in 1945 by Italian partisans.
    Thought 3: Benito Mussolini was assassinated as part of the collapse of the Axis powers during World War II. So the Rome Protocols were signed by three Prime Ministers one of which was assassinated as part of World War II.
    Action 3: Finish[World War II]

    Reflection: I searched one of the prime ministers involved in the signing, then attempted to answer right away. I should have searched each of the prime ministers, then looked up 'death' or 'assassination' on each of their pages to get more information before answering.

    Previous Trial:
    Question: The Oberoi family is part of a hotel company that has a head office in what city?
    Thought 1: I need to search the Oberoi family and find the city where the hotel company's head office is located.
    Action 1: Search[Oberoi family]
    Observation 1: The Oberoi Group is a luxury hotel group with its head office in New Delhi, India. Founded in 1934, the company owns and operates 32 luxury hotels and two river cruise ships in 7 countries, primarily under its Oberoi Hotels & Resorts and Trident brands.
    Thought 2: The Oberoi Group has its head office in New Delhi, India. I just need to finish with New Delhi.
    Action 2: Finish[New Delhi]
    Observation 2: Episode finished, reward = 0

    Reflection: I appeared to have retrieved the correct information about The Oberoi Family and the location of its head office, and provided a corresponding answer. However this answer does not exactly match the ground truth answer so I should try a different wording, such as Delhi.

    Previous trial:
    {trajectory}
    
    Reflection:

  # Value evaluation prompt for scoring search states
  # Variables: {question}, {state}, {trajectory}  
  value_prompt: |
    You are evaluating the progress of a Wikipedia-based question answering system.

    Question: {question}
    
    Current search state and trajectory:
    {state}
    
    Previous failed attempts (for context):
    {trajectory}

    Based on the current progress, evaluate how likely this search path is to successfully answer the question.

    Consider:
    1. Relevance: Has the search found information relevant to the question?
    2. Completeness: How much of the required information has been gathered?
    3. Direction: Is the search heading toward the right entities/topics?
    4. Efficiency: Is progress being made without getting stuck in loops?

    Rate the likelihood of success from this state on a scale of 0-10, where:
    - 0-2: Very unlikely to succeed, wrong direction or stuck
    - 3-4: Low chance, some relevant info but major gaps
    - 5-6: Moderate chance, on the right track but needs more work  
    - 7-8: Good chance, most info gathered, close to answer
    - 9-10: Very likely to succeed, all pieces in place

    Rating (0-10):

  # Standard prompt template (simpler version)
  # Variables: {input}
  standard_prompt: |
    Answer the following question using your knowledge:
    
    Question: {input}
    
    Answer: